alert.duplicate.window.title=Advertencia de instancia duplicada
alert.duplicate.label.title=Ya tienes una instancia de Minecraft en ejecución.
alert.duplicate.label.body=Si inicias otra en el mismo directorio, pueden entrar en conflicto y corromper tus guardados. \nEsto puede causar muchos problemas, en un jugador o de otro tipo. No nos hacemos responsables de nada que salga mal. \n¿Quieres iniciar otra instancia de Minecraft a pesar de esto? \nPuedes solucionar este problema iniciando el juego en un directorio diferente (ver el botón "Editar instalación").

