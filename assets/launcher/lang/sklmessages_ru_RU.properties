alert.duplicate.label.body=Если запустить ещё одну копию игры в той же папке, возможны конфликты и повреждение сохранений. \nЭто может привести к проблемам как в одиночной игре, так и в сетевой. \nМы не несём ответственности за возможные последствия.\nВы всё равно хотите запустить ещё одну копию Minecraft? \nРекомендуется использовать другую папку установки (см. «Редактирование установки»). 
 
