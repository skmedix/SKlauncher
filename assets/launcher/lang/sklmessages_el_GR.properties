alert.duplicate.label.title=Έχετε ήδη ένα παράθυρο του Minecraft ανοικτό.
alert.duplicate.label.body=Εάν εκκινήσετε άλλο ένα στον ίδιο φάκελο, ενδέχεται να συγκρουστούν και να καταστρέψουν τις αποθηκεύσεις σας. \nΑυτό θα μπορούσε να προκαλέσει πολλά προβλήματα, σε single player ή και αλλού. Δεν θα φέρουμε ευθύνη για οτιδήποτε πάει στραβά. \nΘέλετε να ξεκινήσετε μια άλλη παρουσία του Minecraft, παρόλα αυτά; \nΜπορείτε να λύσετε αυτό το ζήτημα εκκινώντας το παιχνίδι σε διαφορετικό φάκελο (δείτε το κουμπί "Επεξεργασία εγκατάστασης").

