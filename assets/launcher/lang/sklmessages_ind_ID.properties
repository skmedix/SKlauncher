# New Alerts
alert.duplicate.window.title=Peringatan Instansi Duplikat
alert.duplicate.label.title=Anda sudah memiliki instansi Minecraft yang sedang berjalan.
alert.duplicate.label.body=Jika Anda meluncurkan instansi lain di direktori yang sama, mereka mungkin bentrok dan merusak simpanan Anda. \nIni dapat menyebabkan banyak masalah, baik dalam mode singleplayer ataupun lainnya. Kami tidak akan bertanggung jawab atas kesalahan apapun yang terjadi. \nMeskipun demikian, apakah Anda ingin memulai instansi Minecraft lagi? \nAnda dapat mengatasi masalah ini dengan meluncurkan game di direktori berbeda (lihat tombol "Edit Instalasi".).

alert.downgrade.window.title=Peringatan Instalasi Tidak Kompatibel
alert.downgrade.label.title=Reset Instalasi?
alert.downgrade.label.body=Sepertinya Anda pernah menggunakan peluncur berbeda sebelumnya! \nJika Anda ingin menggunakan peluncur ini kembali, kami akan butuh reset konfigurasimu.
alert.downgrade.button.reset=Saya yakin, reset konfigurasi saya
alert.downgrade.button.cancel=Tidak jadi, tutup peluncur ini

