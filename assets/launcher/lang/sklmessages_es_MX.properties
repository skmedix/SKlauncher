alert.duplicate.label.body=Si lanzas otra instancia en el mismo directorio, podrían chocar y corromper tus partidas guardadas. \nEsto podría causar muchos problemas, ya sea en un jugador único o en otros casos. No nos haremos responsables de cualquier inconveniente que pueda surgir. \n¿Deseas iniciar otra instancia de Minecraft a pesar de esto? \nPuedes resolver este problema iniciando el juego en un directorio diferente (consulta el botón "Editar instalación").

