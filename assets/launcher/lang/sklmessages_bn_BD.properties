# New Alerts
alert.duplicate.window.title=নকল ইন্সট্যান্স সতর্কতা
alert.duplicate.label.title=আপনার ইতিমধ্যে একটি Minecraft ইন্সট্যান্স চালু আছে।
alert.duplicate.label.body=আপনি যদি একই ডিরেক্টরিতে আরেকটি চালু করেন, সেগুলো সংঘর্ষে লিপ্ত হতে পারে এবং আপনার সেভগুলো নষ্ট করতে পারে। \nএটি একক বা অন্য কোনও খেলায় অনেক সমস্যা সৃষ্টি করতে পারে। কোনো কিছু ভুল হলে আমরা দায়ী থাকব না। \nআপনি কি এরপরেও Minecraft-এর আরেকটি ইন্সট্যান্স শুরু করতে চান? \nআপনি একটি ভিন্ন ডিরেক্টরিতে গেম চালু করে এই সমস্যার সমাধান করতে পারেন ("ইনস্টলেশন সম্পাদনা করুন" বাটন দেখুন)।

